name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = "1.1.0"
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      # ---------- virtual audio hardware so system audio and microphone recording can really be tested
      - name: Virtual audio device (Scream)
        uses: LABSN/sound-ci-helpers@v1
        continue-on-error: true

      - name: Virtual microphone (VB-CABLE)
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 4
        run: |
          Invoke-WebRequest https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip -OutFile vb.zip
          Expand-Archive vb.zip -DestinationPath vb -Force
          $p = Start-Process -FilePath vb/VBCABLE_Setup_x64.exe -ArgumentList "-i","-h" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Host "VB-CABLE installer timed out" }
          Get-CimInstance Win32_SoundDevice | Format-Table Name, Status

      - name: Allow desktop apps to use the microphone (Windows privacy setting)
        shell: pwsh
        run: |
          foreach ($root in "HKLM:","HKCU:") {
            $k = "$root\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone"
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value "Allow"
            New-Item -Path "$k\NonPackaged" -Force | Out-Null
            Set-ItemProperty -Path "$k\NonPackaged" -Name Value -Value "Allow"
          }

      - name: Unit tests (licensing & entitlements)
        run: dotnet test tests/BurhanScreenCapture.Tests -c Release --logger "console;verbosity=normal"

      # ---------- publish the real executables
      - name: Publish Burhan Screen Capture Pro (shipping build)
        run: >
          dotnet publish src/BurhanScreenCapture/BurhanScreenCapture.csproj -c Release -r win-x64
          --self-contained true -p:PublishReadyToRun=true -p:Version=${{ steps.ver.outputs.version }} -o publish/app

      - name: Publish Burhan Screen Capture Pro (test copy that also trusts the CI test key)
        run: >
          dotnet publish src/BurhanScreenCapture/BurhanScreenCapture.csproj -c Release -r win-x64
          --self-contained true -p:Version=${{ steps.ver.outputs.version }}
          -p:TestPublicKeyFile=${{ github.workspace }}\tools\LicenseGenerator\dev-keys\dev-test-public.txt -o publish/app-test

      - name: Publish Burhan Nexus License Key Generator
        run: >
          dotnet publish tools/LicenseKeyGenerator/LicenseKeyGenerator.csproj -c Release -r win-x64
          --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish/generator

      # ---------- end-to-end tests on the published executables
      - name: Generator self-test (published exe) and cross-app license files
        shell: pwsh
        run: |
          Start-Process -FilePath publish/app-test/BurhanScreenCapture.exe -ArgumentList "--print-device-id" -Wait
          $dev = (Get-Content "$env:LOCALAPPDATA\Burhan Nexus\Screen Capture Pro\device-id.txt").Trim()
          Write-Host "Device ID: $dev"
          $p = Start-Process -FilePath publish/generator/BurhanNexusLicenseKeyGenerator.exe -ArgumentList "--selftest","`"$PWD\gen`"","--import-private","`"$PWD\tools\LicenseGenerator\dev-keys\dev-test-private.txt`"","--device",$dev -PassThru -Wait
          Get-Content gen/results.txt
          if ($p.ExitCode -ne 0) { throw "Generator self-test failed ($($p.ExitCode))" }

      - name: App self-test phase 1 (published exe) — capture, editor, audio matrix, licensing, UI
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/app-test/BurhanScreenCapture.exe -ArgumentList "--selftest","`"$PWD\selftest`"","--key-file","`"$PWD\gen\customer.bnxlic`"","--wrong-device-key-file","`"$PWD\gen\other-device.bnxlic`"" -PassThru -Wait
          Get-Content selftest/results.txt
          Get-ChildItem "$env:LOCALAPPDATA\Burhan Nexus\Screen Capture Pro\logs" -Filter "log-*" | Get-Content | Select-String "ERROR|WARN" | Select-Object -First 40
          if (Test-Path "$env:LOCALAPPDATA\Burhan Nexus\Screen Capture Pro\logs\recorder-native.log") { Get-Content "$env:LOCALAPPDATA\Burhan Nexus\Screen Capture Pro\logs\recorder-native.log" -Tail 30 }
          if ($p.ExitCode -ne 0) { throw "Self-test phase 1 failed ($($p.ExitCode))" }

      - name: App self-test phase 2 (new process) — persistence after restart, offline, revocation
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish/app-test/BurhanScreenCapture.exe -ArgumentList "--selftest","`"$PWD\selftest2`"","--phase2","--key-file","`"$PWD\gen\customer.bnxlic`"","--revocations","`"$PWD\gen\revoke-customer.bnxrev`"" -PassThru -Wait
          Get-Content selftest2/results.txt
          if ($p.ExitCode -ne 0) { throw "Self-test phase 2 failed ($($p.ExitCode))" }

      - name: Smoke test shipping executables
        shell: pwsh
        run: |
          foreach ($exe in "publish/app/BurhanScreenCapture.exe","publish/generator/BurhanNexusLicenseKeyGenerator.exe") {
            $p = Start-Process -FilePath $exe -ArgumentList "--minimized" -PassThru
            Start-Sleep -Seconds 10
            if ($p.HasExited) { throw "$exe exited during startup with code $($p.ExitCode)" }
            Stop-Process -Id $p.Id -Force
            Write-Host "OK: $exe"
          }

      - name: Print UI snapshots (base64, for review)
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $codec = [Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $ep = New-Object Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object Drawing.Imaging.EncoderParameter ([Drawing.Imaging.Encoder]::Quality), 80L
          foreach ($n in "ui-light-upgrade","ui-pro-upgrade","ui-dark-recorder","ui-upgrade-dialog","ui-pro-about","ui-light-about") {
            $f = "selftest/$n.png"
            if (!(Test-Path $f)) { continue }
            $img = [Drawing.Image]::FromFile((Resolve-Path $f))
            $w = [Math]::Min(1000, $img.Width); $h = [int]($img.Height * $w / $img.Width)
            $bmp = New-Object Drawing.Bitmap $w, $h
            $g = [Drawing.Graphics]::FromImage($bmp); $g.InterpolationMode = 'HighQualityBicubic'; $g.DrawImage($img, 0, 0, $w, $h); $g.Dispose()
            $ms = New-Object IO.MemoryStream; $bmp.Save($ms, $codec, $ep)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            Write-Host "@@IMG $n"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("@@B " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Host "@@END"
            $img.Dispose(); $bmp.Dispose()
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-results
          path: |
            selftest/*.png
            selftest/*.txt
            selftest2/*.txt
            gen/results.txt
            selftest/recordings/*

      # ---------- installers
      - name: Download Visual C++ runtime for installer
        shell: pwsh
        run: Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile installer/redist/vc_redist.x64.exe

      - name: Build installers (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DPublishDir=..\publish\app installer\BurhanScreenCapture.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (app)" }
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} /DPublishDir=..\publish\generator installer\LicenseKeyGenerator.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (generator)" }

      - name: Portable zip (app)
        shell: pwsh
        run: Compress-Archive -Path publish/app/* -DestinationPath artifacts/BurhanScreenCapturePro-Portable-${{ steps.ver.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BurhanScreenCapturePro-${{ steps.ver.outputs.version }}
          path: |
            artifacts/BurhanScreenCapturePro-*

      - uses: actions/upload-artifact@v4
        with:
          name: ADMIN-ONLY-BurhanNexusLicenseKeyGenerator-${{ steps.ver.outputs.version }}
          path: artifacts/BurhanNexusLicenseKeyGenerator-*

      - name: GitHub Release (tags only — customer app only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/BurhanScreenCapturePro-*
          body_path: CHANGELOG.md
